          - notes/MathematicalPreliminaries/EinsteinSummationConvention.qmd
          - notes/MathematicalPreliminaries/VectorTensorComponents.qmd
          - notes/MathematicalPreliminaries/TraceDeterminant.qmd
          - notes/MathematicalPreliminaries/ChangeOfBasis.qmd
      - section: "Kinematics"
        contents:
          - notes/Kinematics/ContinuousBijectionNotHomeomorphism.qmd
          - notes/Kinematics/BodiesConfigurations.qmd
          - section: "Simple deformations"
            href: notes/Kinematics/SimpleDeformations/index.qmd
            contents:
              - notes/Kinematics/SimpleDeformations/SimpleShear.qmd
              # - section: "Deeper level"      # nest as far as you like
              #   contents:
              #     - notes/Kinematics/SimpleDeformations/Example/Page.qmd
          # - notes/Kinematics/Deformation.qmd
      # - section: "Stress"
      #   contents:
      # - section: "Balance Laws"
      #   contents:
      - section: "Homework"
        href: homework/index.qmd 
        contents: 
        - section: "HW1"
          contents:
            - homework/HW1/Problems.qmd
          # - homework/HW1/Solutions.qmd
        - section: "HW2"
          contents:
            - homework/HW2/Problems.qmd

crossref:
  eq-prefix: "Eq."
  thm-prefix: "Thrm."
  lem-prefix: "Lem."

format:
  html:
    theme:
      - simplex
      # - custom.scss
    toc: true
    toc-depth: 6
    number-sections: true
    number-depth: 6
    html-math-method: mathjax
    include-in-header: _mathjax.html
    css: styles.css